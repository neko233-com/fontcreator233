name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version tag"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: amd64, ext: ".exe" }
          - { os: macos-latest,   arch: amd64, ext: ""      }
          - { os: macos-latest,   arch: arm64, ext: ""      }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}"    >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Format + Vet + Test
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -count=1

      - name: Build binary
        shell: bash
        run: |
          GOOS_VAL="$(go env GOOS)"
          BIN="fontcreator${{ matrix.ext }}"
          PKG="fontcreator233-${{ steps.meta.outputs.tag }}-${GOOS_VAL}-${{ matrix.arch }}"
          mkdir -p "dist/${PKG}"
          LDFLAGS="-s -w -X github.com/neko233-com/fontcreator233/internal/agentschema.Version=${{ steps.meta.outputs.tag }} -X github.com/neko233-com/fontcreator233/internal/agentschema.Commit=${{ steps.meta.outputs.short_sha }} -X github.com/neko233-com/fontcreator233/internal/agentschema.BuildDate=${{ steps.meta.outputs.build_date }}"
          CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -trimpath -o "dist/${PKG}/${BIN}" .
          cp LICENSE NOTICE.md README.md "dist/${PKG}/" 2>/dev/null || true
          cd dist && tar -czf "${PKG}.tar.gz" "${PKG}" && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Build MSI (windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Pin WiX 5.0.2: last freely-licensed release (v6+/v7 require the paid OSMF EULA).
          dotnet tool install --global wix --version 5.0.2
          PKG="fontcreator233-${{ steps.meta.outputs.tag }}-windows-amd64"
          MsiVersion="${{ steps.meta.outputs.tag }}"
          MsiVersion="${MsiVersion#v}"
          wix build scripts/installer/fontcreator.wxs \
            -d "Version=${MsiVersion}" \
            -d "Source=dist/${PKG}" \
            -d "Out=dist/${PKG}.msi" \
            -arch x64 \
            -out "dist/${PKG}.msi" \
            -pdbtype none
          rm -f "dist/${PKG}.wixpdb"
          sha256sum "dist/${PKG}.msi" > "dist/${PKG}.msi.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: fontcreator233-${{ steps.meta.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Verify checksums
        run: |
          mkdir -p dist
          find staging -type f \( -name "*.tar.gz" -o -name "*.msi" -o -name "*.sha256" \) -exec cp {} dist/ \;
          cd dist
          fail=0
          for f in *.tar.gz *.msi; do
            [ -e "$f" ] || continue
            if [ -f "${f}.sha256" ]; then
              sha256sum -c "${f}.sha256" || fail=1
            else
              echo "missing checksum for $f"; fail=1
            fi
          done
          echo "--- artifacts ---"
          ls -lh
          exit $fail

  release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Collect assets
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.tar.gz" -o -name "*.msi" -o -name "*.sha256" \) -exec cp {} dist/ \;
          ls -lh dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: fontcreator233 ${{ github.ref_name }}
          body: |
            ## fontcreator233 ${{ github.ref_name }}

            Deterministic, offline, agent-native font creator.

            ### Install
            ```bash
            # macOS / Linux one-liner
            curl -fsSL https://raw.githubusercontent.com/neko233-com/fontcreator233/main/scripts/install.sh | bash

            # Windows one-liner (portable)
            powershell -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/neko233-com/fontcreator233/main/scripts/install.ps1 | iex"

            # Windows MSI (recommended, needs admin)
            #   double-click fontcreator233-${{ github.ref_name }}-windows-amd64.msi
            ```

            ### Manual download
            ```bash
            # macOS / Linux — pick your platform: macos-amd64 | macos-arm64 | windows-amd64
            tar -xzf fontcreator233-${{ github.ref_name }}-macos-arm64.tar.gz
            ./fontcreator233-${{ github.ref_name }}-macos-arm64/fontcreator version
            ```

            ### Update
            ```bash
            fontcreator update --check   # see if newer exists
            fontcreator update           # download + verify + replace
            ```

            ### Quick start
            ```bash
            fontcreator init --dir work --template geometric --family "My Typeface"
            fontcreator build work/font.recipe.yaml --out dist --target all
            fontcreator specimen dist/MyTypeface-Regular.ttf --open
            ```

            ### Checksums
            `sha256sum -c fontcreator233-*.tar.gz.sha256`
          files: dist/*
          draft: false
          prerelease: false
